name: Sync Resume PDF

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-resume]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Checkout private resume repository
        uses: actions/checkout@v4
        with:
          repository: ascendho/Resume
          token: ${{ secrets.RESUME_REPO_PAT }}
          path: private-resume
          sparse-checkout: |
            Latex/resume.pdf
          sparse-checkout-cone-mode: false

      - name: Copy latest resume into public site
        run: |
          mkdir -p certificates
          cp private-resume/Latex/resume.pdf certificates/resume.pdf

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- certificates/resume.pdf; then
            echo "No changes in resume.pdf"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/resume.pdf
          git commit -m "chore: sync latest resume.pdf from private repo"
          git push