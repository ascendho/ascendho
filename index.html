<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asc Ho</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/common.css">
  <style>
    .about {
      padding: 44px 42px 30px;
      animation: fade-in 0.7s ease;
    }

    h1 {
      margin: 0;
      font-size: 66px;
      line-height: 1.05;
      letter-spacing: 0.3px;
      color: #202a3c;
    }

    .role {
      margin: 18px 0 14px;
      font-size: 35px;
      color: #1f375f;
      font-weight: 500;
    }

    .notice {
      margin: 0;
      color: #1f2937;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.72;
    }

    .desc {
      margin: 0;
      color: #1f2937;
      font-size: 40px;
      line-height: 1.72;
    }

    .desc+.desc {
      margin-top: 18px;
    }

    .contact {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .contact-links {
      display: flex;
      align-items: center;
      gap: 36px;
      flex-wrap: wrap;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .contact-link:hover {
      text-decoration: underline;
    }

    .contact-icon {
      width: 30px;
      height: 30px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .about {
        padding: 28px 22px 24px;
      }

      h1 {
        font-size: 46px;
      }

      .role {
        font-size: 24px;
      }

      .desc {
        font-size: 20px;
      }

      .notice {
        font-size: 20px;
      }

      .contact-link {
        font-size: 19px;
      }

      .contact-icon {
        width: 26px;
        height: 26px;
      }
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 38px;
      }

      .role {
        margin-top: 12px;
        font-size: 21px;
      }

      .desc {
        font-size: 18px;
      }

      .notice {
        font-size: 18px;
      }

      .contact-links {
        gap: 16px;
      }

      .contact-link {
        font-size: 18px;
      }

      .contact-icon {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>

<body>
  <header id="site-header" class="topbar" data-page="about" data-root-prefix=""></header>

  <main class="wrap">
    <section id="about" class="card about">
      <h1>Ascend Ho</h1>
      <p class="role">你好，欢迎来到我的个人网站。</p>
      <p class="notice">【求实习】目前非常渴望能找到一份 C++/大模型应用 相关的实习机会，简历在导航栏的最右侧，若有意，可邮件联系。</p>
      <p class="desc">这个网站会记录我的学习路径、课程证书和阶段性项目，也会逐步整理一些我认为有价值的经验总结。</p>
      <p class="desc">后续我会把这里的内容不断完善，让它成为一个长期更新的个人技术档案。</p>

      <div class="contact">
        <div class="contact-links">
          <a class="contact-link" href="mailto:ascendho@outlook.com" aria-label="发送邮件给 ascendho@outlook.com">
            <svg class="contact-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M8 0a8 8 0 1 0 4.906 14.32l-.722-1.093A6.5 6.5 0 1 1 14.5 8c0 2.162-1.187 3.5-2.5 3.5-1.017 0-1.727-.746-1.727-1.9V5.5H8.8v.749h-.03c-.325-.57-.914-.93-1.691-.93-1.425 0-2.567 1.232-2.567 2.9 0 1.671 1.13 2.904 2.57 2.904.8 0 1.406-.365 1.73-.982h.028v.18c0 1.237.74 2.179 2.06 2.179 2.053 0 3.6-1.899 3.6-4.5A7.5 7.5 0 0 0 8 0Zm-.75 9.805c-.84 0-1.438-.73-1.438-1.589 0-.859.599-1.584 1.438-1.584.848 0 1.451.725 1.451 1.584 0 .86-.603 1.589-1.45 1.589Z" />
            </svg>
            <span>ascendho@outlook.com</span>
          </a>

          <a class="contact-link" href="https://github.com/ascendho" target="_blank" rel="noopener noreferrer"
            aria-label="访问 Asc Ho 的 GitHub">
            <svg class="contact-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.53 7.53 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/nav.js" defer></script>
</body>

</html>
